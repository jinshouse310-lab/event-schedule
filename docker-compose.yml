services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      APP_PASSCODE: ${APP_PASSCODE:?APP_PASSCODE を設定してください / set APP_PASSCODE}
      SESSION_SECRET: ${SESSION_SECRET:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
